        body{
            text-align:center;
            background-color: #dbdddd;

        .div{ margin:0 auto; width:1000px; height:800px; border:1px solid #F00}

<body>
<h1>商品销售额汇总分析</h1>
<div>
    <div id="main" style="width:880px;height: 700px;float:left;">第一个</div>
    <div id="sum" style="width:800px;height: 700px;float:left;">第二个</div>
</div>

<div id="messages"></div>
<script type="text/javascript">

    $.get('http://localhost:8081/getPart31', function (res) {
        var myChart = echarts.init(document.getElementById('main'));
        var option = {
            backgroundColor: '#ffffff',//背景色
            title: {
                text: '商品销售额汇总',
                subtext: '',
                textStyle: {
                    fontWeight: 'normal',              //标题颜色
                    color: '#408829'
                },
            },
            tooltip: {
                trigger: 'axis',
                axisPointer: {
                    type: 'shadow'
                }
            },
            legend: {
                data: ['销售额']
            },
            grid: {
                left: '3%',
                right: '4%',
                bottom: '3%',
                containLabel: true
            },
            xAxis: {
                type: 'value',
                boundaryGap: [0, 0.01]
            },
            yAxis: {
                type: 'category',
                data:res.key
            },
            series: [
                {
                    name: '销售额',
                    type: 'bar',
                    label: {
                        normal: {
                            show: true,
                            position: 'insideRight'
                        }
                    },
                    itemStyle:{ normal:{color:'#f47209'} },
                    data: res.val
                }
            ]
        };
        myChart.setOption(option);
    });
